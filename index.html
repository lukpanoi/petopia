<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Petopia — Lonely No More, When Pets Adore</title>
  <meta name="description" content="Petopia interactive pet adoption and pet care prototype">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5fbf8;color:#193128}.loader{min-height:70vh;display:grid;place-items:center;text-align:center;padding:28px}.loaderMark{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;margin:0 auto 12px;background:#e9fbf2;border:1px solid #ceefdd;font-size:30px}.loader b{font-size:26px;color:#0f9d58}.loader p{margin:7px 0 0;color:#6d7f77;font-size:14px}
  </style>
</head>
<body>
  <div class="loader" id="loader"><div><div class="loaderMark">🐾</div><b>Petopia</b><p>Loading your pet adoption experience…</p></div></div>
  <script>
    (async()=>{
      try{
        const response=await fetch('./app.html?v=20260905-1',{cache:'no-store'});
        if(!response.ok)throw new Error('Unable to load Petopia');
        let html=await response.text();
        html=html.replace('</head>','<link rel="stylesheet" href="./mobile-fix.css?v=20260905-1"></head>');
        html=html.replace('</body>','<script src="./mobile-fix.js?v=20260905-1"><\\/script></body>');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error(error);
        document.getElementById('loader').innerHTML='<div><div class="loaderMark">🐾</div><b>Petopia could not load</b><p>Please refresh the page and try again.</p></div>';
      }
    })();
  </script>
</body>
</html>
