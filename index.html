<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petopia — Lonely No More, When Pets Adore</title>
<meta name="description" content="Petopia interactive pet adoption and pet care prototype">
<style>body{margin:0;font-family:Arial,sans-serif;background:#f7faf9;color:#17221c}#boot{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}#boot b{font-size:28px;color:#128a56}#boot p{color:#65716a}.bootpaw{font-size:44px;margin-bottom:8px}</style>
</head>
<body>
<div id="boot"><div><div class="bootpaw">🐾</div><b>Petopia</b><p>Loading your pet adoption experience…</p></div></div>
<script>
(async()=>{
 const styles=['chunks/style-01.txt', 'chunks/style-02.txt', 'chunks/style-03.txt', 'chunks/style-04.txt', 'chunks/style-05.txt', 'chunks/style-06.txt'];
 const bodies=['chunks/body-01.txt', 'chunks/body-02.txt', 'chunks/body-03.txt', 'chunks/body-04.txt'];
 const scripts=['chunks/script-01.txt', 'chunks/script-02.txt', 'chunks/script-03.txt', 'chunks/script-04.txt', 'chunks/script-05.txt', 'chunks/script-06.txt'];
 const read=async(list)=>{const out=await Promise.all(list.map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u);return r.text()}));return out.join('')};
 try{
  const [css,html,js]=await Promise.all([read(styles),read(bodies),read(scripts)]);
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  document.body.innerHTML=html;
  const sc=document.createElement('script');sc.textContent=js;document.body.appendChild(sc);
 }catch(err){document.getElementById('boot').innerHTML='<div><div class="bootpaw">🐾</div><b>Petopia could not load</b><p>Please refresh the page.</p></div>';console.error(err)}
})();
</script>
</body>
</html>
